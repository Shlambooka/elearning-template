<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini E-Learning</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>📚 Mini Learning Hub</h1>
        <p>Learn something new today</p>
    </header>

    <main>
        <aside id="course-list">
            <h2>Courses</h2>
            <!-- Course list generated by JS -->
        </aside>

        <section id="lesson-view">
            <h2 id="lesson-title">Select a lesson</h2>
            <div id="lesson-content">Choose a course from the left to start learning.</div>
            <button id="complete-btn" style="display:none;">Mark as Complete</button>
            <p id="progress-status"></p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
